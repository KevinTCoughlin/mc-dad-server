version: 2
# Keeps Go modules, pinned GitHub Actions SHAs, and container base-image
# digests current. CI on Go 1.26 gates every update.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # golang.org/x/* periodically raise their minimum Go version; keep them
      # in their own PR so a toolchain bump never blocks other updates.
      golang-x:
        patterns: ["golang.org/x/*"]
      go-dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # Containerfile builder/runtime base images (pinned by digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      container-images:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      devcontainers:
        patterns: ["*"]
    cooldown:
      default-days: 7
